<form method="post" action="{% url 'submit_brief' %}" class="stack" id="brief-form">
  {% csrf_token %}
  {{ brief_form.non_field_errors }}
  {% for f in brief_form %}
    {% if f.name == 'leave_empty' %}<div class="hp" aria-hidden="true">{{ f }}</div>
    {% else %}
    <label><span class="mono">{{ f.label }}</span>{{ f }}{% for e in f.errors %}<em class="err">{{ e }}</em>{% endfor %}</label>
    {% endif %}
  {% endfor %}
  <div class="submit"><button class="btn primary" type="submit">Send the brief</button></div>
</form>
